# Objavi igro na GitHub Pages ob vsakem pushu na main: https://poletko.github.io/train/
# Enkratna nastavitev: repo Settings -> Pages -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Preveri sintakso
        run: for f in js/*.js; do node --check "$f"; done

      # na strani je samo igra (brez orodij za razvoj)
      - name: Pripravi stran
        run: |
          mkdir -p _site
          cp -r index.html js _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
